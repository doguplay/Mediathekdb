name: Daten aktualisieren

on:
  schedule:
    - cron: "0 3 * * *"   # täglich ca. 05:00 Uhr deutscher Zeit
  workflow_dispatch:       # manuell startbar

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: update.py ausführen
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: python update.py

      - name: Ergebnis speichern
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.js omdb_cache.json
          git diff --staged --quiet || git commit -m "Daten aktualisiert"
          git push
