<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mediathek-Scores</title>
<style>
:root{--bg:#f6f6f4;--fg:#1c1c1a;--card:#fff;--mut:#6b6b66;--bd:#e2e2dd;--ac:#d9480f}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--fg:#eee;--card:#222220;--mut:#9a9a94;--bd:#33332f;--ac:#ff8c5a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
header{padding:16px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--bd);z-index:2}
h1{margin:0 0 10px;font-size:20px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
input[type=search],select{padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
input[type=search]{flex:1;min-width:140px}
label{font-size:14px;color:var(--mut)}
input[type=range]{flex:1;min-width:120px;accent-color:var(--ac)}
#count{font-size:13px;color:var(--mut);margin-top:6px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit}
.poster{aspect-ratio:2/3;background:var(--bd) center/cover no-repeat}
.info{padding:8px 10px}
.t{font-weight:600;font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.m{font-size:12px;color:var(--mut);margin-top:2px}
.s{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:99px;background:var(--ac);color:#fff;font-size:13px;font-weight:600}
.s.none{background:var(--bd);color:var(--mut)}
#empty{padding:32px 16px;color:var(--mut);text-align:center}
</style>
</head>
<body>
<header>
  <h1>ARD &amp; ZDF Mediathek – Scores</h1>
  <div class="row">
    <input type="search" id="q" placeholder="Titel suchen …">
  </div>
  <div class="row">
    <select id="type"><option value="">Filme &amp; Serien</option><option value="movie">Nur Filme</option><option value="tv">Nur Serien</option></select>
    <select id="ch"><option value="">Alle Sender</option></select>
    <select id="sort">
      <option value="imdb">Beste IMDb zuerst</option>
      <option value="date">Neueste zuerst</option>
      <option value="title">A–Z</option>
    </select>
  </div>
  <div class="row">
    <label for="min">Min. IMDb: <b id="minv">0.0</b></label>
    <input type="range" id="min" min="0" max="10" step="0.1" value="0">
    <label><input type="checkbox" id="hide"> ohne Score ausblenden</label>
  </div>
  <div id="count"></div>
</header>
<main id="grid"></main>
<div id="empty" hidden></div>

<script src="data.js"></script>
<script>
const D = window.MEDIATHEK_DATA || {items:[]};
const items = D.items;
const $ = id => document.getElementById(id);
const chs = [...new Set(items.map(i => i.channel))].sort();
chs.forEach(c => $('ch').add(new Option(c, c)));

function render(){
  const q = $('q').value.toLowerCase(), t = $('type').value, c = $('ch').value;
  const min = parseFloat($('min').value), hide = $('hide').checked;
  $('minv').textContent = min.toFixed(1);
  let list = items.filter(i =>
    (!q || i.title.toLowerCase().includes(q)) &&
    (!t || i.type === t) && (!c || i.channel === c) &&
    (min === 0 ? (!hide || i.imdb != null) : (i.imdb != null && i.imdb >= min)));
  const s = $('sort').value;
  list.sort((a,b) => s === 'title' ? a.title.localeCompare(b.title,'de')
    : s === 'date' ? (b.date||0)-(a.date||0)
    : (b.imdb ?? -1) - (a.imdb ?? -1));
  $('count').textContent = list.length + ' Titel' + (D.updated ? ' · Stand ' + D.updated.replace('T',' ') : '');
  const g = $('grid'); g.innerHTML = '';
  const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  g.innerHTML = list.slice(0, 600).map(i => {
    const poster = i.poster && i.poster !== 'N/A' ? `style="background-image:url('${esc(i.poster)}')"` : '';
    const meta = [i.type === 'tv' ? 'Serie' : 'Film', i.channel, i.year].filter(Boolean).join(' · ');
    const score = i.imdb != null ? `<span class="s">★ ${i.imdb.toFixed(1)}</span>` : `<span class="s none">kein Score</span>`;
    const href = i.url ? `href="${esc(i.url)}" target="_blank" rel="noopener"` : '';
    return `<a class="card" ${href}><div class="poster" ${poster}></div><div class="info"><div class="t">${esc(i.title)}</div><div class="m">${esc(meta)}</div>${score}</div></a>`;
  }).join('');
  const e = $('empty');
  e.hidden = list.length > 0;
  e.textContent = items.length ? 'Keine Treffer.' : 'Noch keine Daten. Führe update.py aus (siehe README.md), dann diese Seite neu laden.';
}
['q','type','ch','sort','min','hide'].forEach(id => $(id).addEventListener('input', render));
render();
</script>
</body>
</html>
